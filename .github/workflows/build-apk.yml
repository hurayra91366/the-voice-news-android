
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

    
      - name: Create Android project
        run: |
          cd the_voice_news_android
          flutter create --platforms=android .
         
          python3 -c 'from pathlib import Path; p=Path("android/app/src/main/AndroidManifest.xml"); s=p.read_text(); permission="<uses-permission android:name=\"android.permission.INTERNET\" />"; p.write_text(s.replace("<application", permission+"\n    <application", 1) if permission not in s else s)'



      - name: Install dependencies
        run: |
          cd the_voice_news_android
          flutter pub get

      - name: Build APK
        run: |
          cd the_voice_news_android
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: The-Voice-News-APK
          path: the_voice_news_android/build/app/outputs/flutter-apk/app-release.apk
